<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SagarSoft Admin Panel</title>
<link rel="stylesheet" href="/css/admin.css">
<script>
(function(){
  if ("caches" in window) {
    caches.keys().then(function(ks) {
      ks.forEach(function(k) { if (k.indexOf("sagarsoft") >= 0) caches.delete(k); });
    });
  }
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(rs) {
      rs.forEach(function(r) { r.unregister(); });
    });
    navigator.serviceWorker.register = function() { return Promise.reject(); };
  }
})();
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo">S</div>
      <div class="brand-text">
        <strong>SagarSoft</strong>
        <span>Super Admin</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active">
        <span class="nav-icon">&#9632;</span>
        Dashboard
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="App.loadSchools()">
        <span class="nav-icon">&#8635;</span>
        Refresh
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <h1>School Management</h1>
      <div class="header-right">
        <span class="connection-status">
          <span class="dot" id="connDot"></span>
          <span id="connText">Checking...</span>
        </span>
      </div>
    </header>

    <div class="content">
      <div class="stats">
        <div class="stat-card">
          <div class="label">Total Schools</div>
          <div class="value blue" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Active</div>
          <div class="value green" id="statActive">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Inactive / Locked</div>
          <div class="value amber" id="statInactive">0</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Schools</h2>
          <div class="toolbar">
            <div class="search-box">
              <span class="search-icon">&#128269;</span>
              <input type="text" id="searchInput" placeholder="Search schools..." autocomplete="off">
            </div>
            <button class="btn btn-primary" id="addSchoolBtn">+ Add School</button>
          </div>
        </div>
        <div class="card-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>School ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Plan</th>
                  <th>Start Date</th>
                  <th>Expiry</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="schoolsTableBody">
                <tr><td colspan="8"><div class="empty-state"><div class="empty-icon">&#8987;</div><p>Loading schools...</p></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="modalOverlay" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" onclick="Modal.close()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div id="loadingOverlay" class="loading-overlay"><div class="spinner"></div></div>

<script src="/js/admin.js"></script>
</body>
</html>
