services:
  - type: web
    name: sagarsoft-online
    runtime: node
    repo: https://github.com/YOUR_USERNAME/YOUR_REPO
    rootDir: sagarsoft
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SAGARSOFT_API_KEY
        sync: false
      - key: DEFAULT_SCHOOL_ID
        value: SCH-2026-001
